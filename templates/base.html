<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Online Resume Builder{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body>
<header class="top"><a class="brand" href="{{ url_for('index') }}">📄 Resume Builder</a>
<a class="btn" href="{{ url_for('new') }}">+ New Resume</a></header>
<main class="wrap">
{% with m = get_flashed_messages(with_categories=true) %}{% for c, t in m %}<div class="flash {{ c }}">{{ t }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}</main>{% block scripts %}{% endblock %}</body></html>
